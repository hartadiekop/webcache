<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Balibird</title>
    <style>
      :root {
        --bg: #0b1020;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .frame-shell {
        width: 100vw;
        height: calc(100vh - var(--safe-top) - var(--safe-bottom));
        height: calc(100dvh - var(--safe-top) - var(--safe-bottom));
        max-width: 100%;
        max-height: 100%;
        overflow: hidden;
        background: var(--bg);
        padding: 0;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #ffffff;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="frame-shell">
      <iframe
        title="Balibird"
        src="https://jagel.link/balibird"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; camera; clipboard-write; display-capture; fullscreen; geolocation; microphone; notifications; picture-in-picture; web-share"
      ></iframe>
    </div>
  </body>
</html>
